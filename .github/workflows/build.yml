name: Windows build and tests
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release for the version in Directory.Build.props (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Install pinned Inno Setup 7
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/downloads | Out-Null
          $setup = Join-Path $PWD '.tools/downloads/innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup checksum mismatch.' }
          $install = Start-Process -FilePath $setup -ArgumentList '/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + (Join-Path $PWD '.tools/inno') + '"') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Attach a FAT32 volume for the stream-less file system tests
        shell: pwsh
        continue-on-error: true
        run: |
          $image = Join-Path $env:RUNNER_TEMP '7zipper-fat32.vhd'
          $letter = 'T','U','V','W' | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          $commands = @(
            "create vdisk file=`"$image`" maximum=256 type=expandable",
            "select vdisk file=`"$image`"",
            'attach vdisk',
            'create partition primary',
            'format fs=fat32 quick',
            "assign letter=$letter"
          )
          $script = Join-Path $env:RUNNER_TEMP '7zipper-fat32.diskpart'
          $commands | Set-Content -LiteralPath $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -eq 0 -and (Test-Path "${letter}:\")) { "SEVENZIPPER_TEST_FAT_ROOT=${letter}:\" >> $env:GITHUB_ENV }
          else { Write-Output '::warning::The FAT32 test volume is unavailable; the stream-less volume tests are skipped.' }
          exit 0
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Test -Publish -Installer
      - name: Test real packaged app commands
        shell: pwsh
        run: |
          $verifier = (Get-Command 7z.exe -ErrorAction Stop).Source
          $app = Join-Path $PWD 'artifacts/publish/7Zipper.exe'
          if (Get-Process 7Zipper -ErrorAction SilentlyContinue) { throw 'Unexpected existing application.' }
          try {
            foreach ($verb in 'compress-7z','compress-zip','extract-here','extract-smart','convert-7z') {
              & ./build/shell/tests/shell_installed.exe artifacts $verifier library $verb ./artifacts/publish/SevenZipper.Shell.dll
              if ($LASTEXITCODE -ne 0) { throw "Packaged app command failed: $verb" }
            }
          } finally {
            Get-Process 7Zipper -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $app } | ForEach-Object {
              if (-not $_.CloseMainWindow() -or -not $_.WaitForExit(10000)) { throw 'Test application did not close.' }
            }
          }
      - name: Test installer in disposable runner
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = $properties.Project.PropertyGroup.Version
          ./tests/shell/installer-smoke.ps1 -Installer "dist/7Zipper-Setup-$version-x64.exe" -DisposableEnvironment
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 7Zipper-win-x64
          path: dist/*
          if-no-files-found: error
  release:
    needs: windows
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 7Zipper-win-x64
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          (cd dist && tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict -)
          {
            cat "docs/release-$tag.md"
            printf '\n\n자동 빌드·시험·설치판 생성: [Windows CI 통과](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$tag" "dist/7Zipper-Setup-$version-x64.exe" "dist/7Zipper-$version-win-x64-portable.zip" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "7Zipper $tag" --notes-file release-notes.md --target "$GITHUB_SHA"
