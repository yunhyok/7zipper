name: Windows build and tests
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Build, test and package
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6;C:\Program Files\Inno Setup 7'
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { throw 'Inno Setup is missing from runner.' }
          ./scripts/build.ps1 -Test -Publish -Installer
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 7Zipper-win-x64
          path: dist/*
          if-no-files-found: error
